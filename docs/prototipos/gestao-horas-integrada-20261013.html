isplay:grid;gap:6px}.person-name span{font-size:13px;color:#6b685f}.panel{margin-top:16px;border-left:3px solid #4a5568;padding:16px;background:#f1efe8;border-radius:4px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:7px;font-size:13px;font-weight:600;min-width:0}input,select,textarea{min-height:46px;width:100%;min-width:0;border:1px solid #cfc9bb;border-radius:5px;background:#fffdf9;padding:10px;font-size:16px}textarea{min-height:85px}.interval{display:grid;grid-template-columns:minmax(170px,2fr) repeat(2,minmax(105px,1fr)) auto;gap:12px;align-items:end;margin-top:12px;padding:14px;background:#fffdf9;border:1px solid #ddd8cc;border-radius:6px}.interval .ref{grid-column:1/-1}.interval button{padding:10px 12px}.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.badge{display:inline-block;padding:7px 10px;border-radius:5px;font-size:12px;font-weight:600;background:#f1efe8;color:#5f5e5a}.badge.good{background:#e6ede4;color:#3f6248}.badge.warning{background:#f7edd6;color:#7a581d}.badge.bad{background:#f2e3e0;color:#8c4a40}.banner{padding:13px 16px;background:#f7edd6;color:#7a581d;border-left:3px solid #b9791e;margin:16px 0;line-height:1.5}.quiet{background:#f1efe8;color:#5f5e5a;border-left-color:#4a5568}.metrics{display:flex;flex-wrap:wrap;gap:24px;margin:18px 0}.metrics>div{min-width:120px}.metrics strong{display:block;font-size:26px;margin-bottom:4px}.metrics span{font-size:13px;color:#6b685f}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;font-size:12px;color:#6b685f;background:#f1efe8}td,th{padding:13px 10px;border-bottom:1px solid #ddd8cc;vertical-align:top}td small{display:block;margin-top:5px;color:#6b685f;font-size:12px}details{border-bottom:1px solid #ddd8cc;padding:14px 0}summary{min-height:44px;cursor:pointer;line-height:1.5;padding:10px}.err{color:#8c4a40;min-height:20px}.feedback{color:#3f6248;padding:10px 0}.row-history{padding:12px 0;border-bottom:1px solid #ddd8cc}.foot{padding:18px 0;color:#6b685f;font-size:13px;line-height:1.5}.check{display:flex;align-items:center;gap:12px;font-size:14px;margin:16px 0}.check input{width:22px;min-height:22px;height:22px}.compact-list{display:grid;gap:10px}.total{font-size:18px;font-weight:600;margin:16px 0}.neutral-falta{min-height:46px;padding:10px 16px}.notice-only{color:#7a581d}.hidden{display:none}[hidden]{display:none!important}@media(max-width:1100px){.rail{flex-basis:145px;padding:24px 12px}.brand{font-size:17px}main{padding:20px}.interval{grid-template-columns:minmax(0,2fr) repeat(2,minmax(88px,1fr)) auto;gap:10px}.modes button{padding:10px 12px}}@media(max-width:850px){.rail{flex-basis:120px;padding:20px 10px}.brand{font-size:15px}.rail p{font-size:12px;padding:12px 5px}main{padding:18px}.interval{grid-template-columns:repeat(2,minmax(0,1fr))}.interval>.destination{grid-column:1/-1}.interval>.remove{grid-column:1/-1;justify-self:end}.fields{gap:12px}.person{padding:16px}.modes button{flex:1 1 140px}.metrics{gap:16px}.metrics strong{font-size:23px}}@media(max-width:560px){.rail{display:none}main{padding:14px}.fields{grid-template-columns:1fr}.person-head .actions{width:100%}.person-head .actions button{flex:1}.prototype-nav{padding:12px}.prototype-nav select{min-width:0}.interval{padding:12px}.toolbar label{flex-basis:100%}h1{font-size:23px}}

.reference-read{display:grid;gap:8px;font-size:13px}.reference-read strong{font-size:16px}.reference-read small{font-size:12px;color:#6b685f}.other-fields{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}.interval{padding:10px;margin-top:8px;gap:10px}.panel{padding:12px}.panel label{gap:5px}.panel input,.panel select{min-height:44px;padding:9px}.panel .meta{margin:10px 0}.modes{gap:8px;margin:12px 0}@media(min-width:561px) and (max-width:850px){.interval{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.interval>.remove{grid-column:auto;min-height:44px;align-self:end}.interval>.destination{grid-column:1/-1}}@media(max-width:560px){.other-fields{grid-template-columns:1fr}}
</style></head><body><div class="demo"><strong>PROPOSTA PARA APROVAÇÃO · Dados inteiramente sintéticos</strong><small>Sem ligação à plataforma ou à BD. As confirmações abaixo apenas simulam os estados propostos.</small></div><nav class="prototype-nav" aria-label="Cenários do protótipo"><label for="scenario">MODELO NAVEGÁVEL</label><select id="scenario"></select><button id="previous">ANTERIOR</button><button id="next">SEGUINTE</button></nav><div class="shell"><aside class="rail"><div class="brand">PRIMELINE | GO<small>GESTÃO DE OBRAS</small></div><p>Visão Geral</p><p>Obras</p><p id="equipa-nav" class="active">Equipa</p><p id="rh-nav">RH</p><p id="maps-nav">Mapa de Gestão</p><p>Planeamento</p><p>Financeiro</p></aside><main id="screen"></main></div><script>
const root=document.getElementById('screen');
const names=['Registo diário · tablet','Dia Inteiro / Manhã / Tarde','Personalizado · vários destinos','Garantia de Obra / Outra','Faltou · reporte neutro','Relatório de Horas · equipa','Conferência mensal · RH','Relatório mensal · colaborador','Decisão sobre excedentes','Devolvido para correção','Validado para integração','Corrigido após validação','Mapas · provisório / validado','Manhã · técnica sexta','Tarde · técnica sexta'];
let selectedName='Colaborador exemplo';let view=Number(location.hash.slice(1))||0,mode='dia',profile='operacional',date='2026-10-13',rows=[],closed=false,decision='pendente',factsChecked=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>m<60?(m===0?'0h':m+'min'):Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'');
const time=x=>Number(x.slice(0,2))*60+Number(x.slice(3));
const badge=(s,c='')=>'<span class="badge '+c+'">'+s+'</span>';
const button=(label,attr='',p=false)=>'<button '+attr+' class="'+(p?'primary':'secondary')+'">'+label+'</button>';
const actions=s=>'<div class="actions">'+s+'</div>';
const metrics=items=>'<div class="metrics">'+items.map(([v,l])=>'<div><strong>'+v+'</strong><span>'+l+'</span></div>').join('')+'</div>';
const heading=(area,title,sub)=>'<div class="eyebrow">'+area+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p>';
function defaults(){const fri=new Date(date+'T12:00:00Z').getUTCDay()===5;return profile==='tecnica'?(fri?[['08:00','13:00'],['14:00','17:00']]:[['09:00','13:00'],['14:00','18:00']]):[['08:00','12:00'],['13:00','17:00']];}
function setRows(){const x=defaults();rows=mode==='personalizado'?[{dest:'a',start:'',end:''},{dest:'a',start:'',end:''}]:mode==='manha'?[{dest:'a',start:x[0][0],end:x[0][1]}]:mode==='tarde'?[{dest:'a',start:x[1][0],end:x[1][1]}]:x.map(([start,end])=>({dest:'a',start,end}));}
function destination(r,i){return '<label class="destination">DESTINO · PERÍODO '+(i+1)+'<select data-dest="'+i+'">'+[['a','Obra exemplo A'],['b','Obra exemplo B'],['c','Obra exemplo C'],['garantia','Garantia de Obra'],['outra','Outra']].map(([v,l])=>'<option value="'+v+'" '+(r.dest===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>';}
function period(r,i){return '<div class="interval">'+destination(r,i)+'<label>ENTRADA<input type="time" value="'+r.start+'" data-time="'+i+'" data-field="start"></label><label>SAÍDA<input type="time" value="'+r.end+'" data-time="'+i+'" data-field="end"></label>'+(mode==='personalizado'?'<button class="remove" data-remove="'+i+'">RETIRAR</button>':'')+(r.dest==='outra'?'<div class="other-fields"><label>TIPO DE DESTINO<select data-other-kind="'+i+'"><option value="work" '+(r.otherKind!=='free'?'selected':'')+'>Obra ativa autorizada</option><option value="free" '+(r.otherKind==='free'?'selected':'')+'>Referência livre</option></select></label>'+(r.otherKind!=='free'?'<label>OBRA ATIVA<select data-other-work="'+i+'">'+['a','b','c'].map(w=>'<option value="'+w+'" '+((r.work||'a')===w?'selected':'')+'>Obra exemplo '+w.toUpperCase()+'</option>').join('')+'</select></label>':'')+'</div>':'')+(r.dest==='garantia'||r.dest==='outra'&&r.otherKind==='free'?'<label class="ref">NOME / REFERÊNCIA ORIGINAL<input data-ref="'+i+'" value="'+esc(r.ref||'')+'" placeholder="Referência do trabalho"></label>':'')+'</div>';}
function form(){return '<section class="panel" aria-label="Formulário contextual"><h2>Registar horário · '+esc(selectedName)+'</h2><div class="fields"><div class="reference-read"><span>JORNADA DE REFERÊNCIA</span><strong>'+(profile==='tecnica'?'Técnica · 8h':'Operacional · 8h')+'</strong><small>Confirmada pelo RH · Somente consulta</small></div><label>DATA<input id="point-date" type="date" value="'+date+'"></label></div><p class="meta">Horários sugeridos pela referência confirmada do colaborador para esta data. Pode ajustar as horas reais; a jornada habitual permanece intacta.</p><div class="modes">'+[['dia','DIA INTEIRO'],['manha','MANHÃ'],['tarde','TARDE'],['personalizado','PERSONALIZADO']].map(([m,l])=>'<button data-mode="'+m+'" aria-pressed="'+(mode===m)+'">'+l+'</button>').join('')+'</div><div id="periods">'+rows.map(period).join('')+'</div>'+(mode==='personalizado'?actions(button('+ ADICIONAR PERÍODO','id="add-period"'))+'<p class="meta">Até 4 destinos / 16 intervalos. Um intervalo 10:30–14:30 permanece inteiro.</p>':'')+'<p class="total" id="point-total" aria-live="polite"></p><label>OBSERVAÇÃO OPERACIONAL<textarea placeholder="Observação opcional"></textarea></label>'+actions(button('CANCELAR','id="cancel-form"')+button('REVER E CONFIRMAR','id="preview-point"',true))+'<p id="point-error" class="err" role="alert"></p><div id="point-preview" aria-live="polite"></div></section>';}
function person(name='Colaborador exemplo',role='Pedreiro',record='Sem horário registado',show=true){return '<article class="person" data-recorded="'+(record!=='Sem horário registado')+'"><div class="person-head"><div class="person-name"><strong>'+name+'</strong><span>'+role+'</span><span>'+record+'</span></div>'+actions(button(record==='Sem horário registado'?'REGISTAR':'EDITAR','data-open-editor',true)+(show?button('FALTOU','data-faltou'):'') )+'</div><div class="contextual"></div></article>';}
function table(headers,rs){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function dayDetails(){return '<details open><summary>13/10 · 7h registadas · 1h em falta · 3 destinos</summary>'+table(['Destino','Entrada','Saída','Registado'],[['Obra exemplo A','08:00','10:00','2h'],['Obra exemplo B','10:30','12:00','1h30'],['Obra exemplo C','13:00','14:30','1h30'],['Obra exemplo A','15:00','17:00','2h']])+'<p class="meta">Referência diária congelada: 8h · Versão individual 1. Esperado usado uma única vez.</p></details><details><summary>14/10 · 9h registadas · excedente 1h</summary><p>08:00–12:00 / 13:00–18:00 · Horas reais preservadas.</p><p>Excedente: '+badge('PENDENTE DE CLASSIFICAÇÃO','warning')+'</p>'+actions(button('ANALISAR EXCEDENTE','data-go="8"'))+'</details><details><summary>15/10 · Faltou · aguarda classificação</summary><p>Ocorrência neutra reportada pelo Encarregado. Nenhuma hora criada.</p></details><details><summary>16/10 · 8h registadas · regular</summary><p>08:00–12:00 / 13:00–17:00 · Não exige aprovação diária.</p></details>';}
function render(){document.getElementById('scenario').innerHTML=names.map((n,i)=>'<option value="'+i+'" '+(i===view?'selected':'')+'>'+ (i+1)+' · '+n+'</option>').join('');document.querySelectorAll('.rail p').forEach(x=>x.classList.remove('active'));document.getElementById(view<6||view>=13?'equipa-nav':view===12?'maps-nav':'rh-nav').classList.add('active');
let html='';
if(view===0){html=heading('EQUIPA / FOLHA DE PONTO','Folha de Ponto','Encarregado · Obra exemplo A · 13/10/2026')+'<div class="toolbar"><label>OBRA<select><option>Obra exemplo A</option><option>Obra exemplo B</option></select></label><label>DATA<input type="date" value="2026-10-13"></label>'+button('RELATÓRIO DE HORAS','data-go="5"')+'</div><p>3 pessoas · 1 registada · 2 por registar</p>'+actions(button('REGISTAR DIA NORMAL DA EQUIPA','data-sim="Rever apenas pessoas elegíveis: sem ausência, ponto ou conflito. Horários sugeridos editáveis antes da confirmação."',true))+'<h2>Pessoal Primeline</h2>'+person()+person('Pessoa exemplo 2','Servente','08:00–12:00 / 13:00–17:00 · 8h',true)+'<h2>Mão de obra externa</h2>'+person('Externo exemplo','Fornecedor exemplo','Sem horário registado',false);}
if(view>=1&&view<=3||view>=13){html=heading('EQUIPA / FOLHA DE PONTO','Registo no cartão',(view>=13?'Técnico exemplo':'Colaborador exemplo')+' · Obra exemplo A')+(view>=13?person('Técnico exemplo','Diretor de Obra','Sem horário registado',false):person());}
if(view===4){html=heading('EQUIPA / FOLHA DE PONTO','Faltou','Ocorrência factual · Encarregado · Hoje ou ontem')+person()+'<div class="banner quiet">O encarregado reporta apenas FALTOU. Classificação e eventual remuneração pertencem ao Administrativo.</div>';}
if(view===5){html=heading('EQUIPA / RELATÓRIO DE HORAS','Relatório de Horas','Horas factuais da equipa · Sem classificação de HE nesta vista')+'<div class="toolbar"><label>PERÍODO<select><option>Semana · 12–16 outubro</option><option>Mês · outubro 2026</option></select></label><label>OBRA<select><option>Obra exemplo A</option></select></label>'+button('CONSULTAR','data-sim="Consulta de exemplo; sem pedidos à BD."')+'</div>'+metrics([['9h','Dia · exemplo'],['39h','Semana · exemplo'],['155h30','Mês · exemplo']])+table(['Colaborador / dia','Entrada / saída','Horas registadas','Correções'],[['Colaborador exemplo<small>14/10 · Obra exemplo A</small>','08:00–12:00 / 13:00–18:00','9h',badge('FACTOS REGISTADOS')],['Pessoa exemplo 2<small>13/10 · Obra exemplo A</small>','08:00–12:00 / 13:00–17:00','8h','Corrigido · motivo disponível']])+'<details><summary>Histórico de alterações · Pessoa exemplo 2</summary><p>Saída 16:30 → 17:00 · autor Encarregado exemplo · 13/10 17:15 · Correção de saída confirmada.</p></details><p class="meta">Totais ilustrativos de períodos distintos. Não constituem um fecho mensal.</p>';}
if(view===6){html=heading('RH / HORAS','Conferência mensal de horas','Administrativo · Uma conferência por colaborador e competência')+'<div class="toolbar"><label>COMPETÊNCIA<input type="month" value="2026-10"></label><label>ESTADO<select><option>Todos</option><option>Por conferir</option><option>Devolvido</option><option>Validado para integração</option></select></label></div>'+table(['Colaborador','Previsto','Realizado','Pendências','Conferência'],[['Colaborador exemplo<small>Primeline · jornada confirmada</small>','176h','175h','1h em falta · 1 excedente · 1 falta',button('CONFERIR MÊS','data-go="7"',true)],['Pessoa exemplo 2','176h','176h','Sem pendências',badge('VALIDADO','good')],['Técnico exemplo','Por confirmar','160h','Referência diária pendente',badge('POR CONFERIR','warning')]])+'<p class="meta">Não inclui trabalhadores externos no vencimento interno. 176h é valor de exemplo, não jornada calculada da produção.</p>';}
if(view===7){html=heading('RH / CONFERÊNCIA MENSAL','Colaborador exemplo · Outubro 2026','Factos por dia e destino · Expanda apenas quando precisar consultar')+badge('EM CONFERÊNCIA')+metrics([['176h','Esperado mensal · exemplo'],['175h','Realizado mensal · exemplo'],['1h','Diferença mensal · exemplo']])+'<p class="meta">Somas de dias: faltas e excedentes não se anulam automaticamente.</p>'+dayDetails()+'<label class="check"><input id="facts-checked" type="checkbox" '+(factsChecked?'checked':'')+'>CONFIRMO A CONFERÊNCIA DOS FACTOS DO MÊS</label>'+actions(button('DEVOLVER PARA CORREÇÃO','data-go="9"')+button('VALIDAR COMPETÊNCIA PARA INTEGRAÇÃO','id="monthly-validate"',true))+'<p id="monthly-error" role="alert" class="err"></p><p class="meta">Sem validação diária obrigatória. Referência, ausências, conflitos e HE por classificar continuam a bloquear. HE reconhecida é informativa.</p>';}
if(view===8){html=heading('RH / CONFERÊNCIA / EXCEDENTES','Decisão administrativa · 14/10','Colaborador exemplo · Outubro 2026')+metrics([['8h','Referência congelada'],['9h','Horas registadas'],['1h','Excedente factual']])+'<p>Factos: 08:00–12:00 / 13:00–18:00. A decisão não altera entradas e saídas.</p><section class="person"><label>CLASSIFICAÇÃO<select id="he-decision"><option value="pendente">Pendente</option><option value="validada">Considerar HE</option><option value="nao_considerada">Não considerar HE</option></select></label><label>MOTIVO<textarea id="he-reason" placeholder="Justificação da decisão administrativa"></textarea></label>'+actions(button('VOLTAR AO MÊS','data-go="7"')+button('REVER DECISÃO','id="decide-he"',true))+'<p id="he-error" role="alert" class="err"></p><div id="he-result" aria-live="polite"></div></section><div class="banner">HR-27: HE reconhecida é informativa, sem custo, processamento ou pagamento na plataforma. Não bloqueia por si só; as outras pendências continuam bloqueantes.</div><details><summary>Histórico da decisão</summary><p>Decisões anteriores e respetivos factos/revisões permanecem no histórico após correção.</p></details>';}
if(view===9){html=heading('RH / CONFERÊNCIA MENSAL','Devolver para correção','Colaborador exemplo · 13/10 · Competência outubro')+badge('CONFERÊNCIA DO MÊS PENDENTE','warning')+'<section class="person"><p>Registo factual: 08:00–10:00 / 10:30–12:00 / 13:00–14:30 / 15:00–17:00 · 7h.</p><label>MOTIVO E REGISTOS A REVER<textarea id="return-reason">Confirmar a saída do último intervalo de 13/10. As horas atuais serão preservadas até à correção.</textarea></label>'+actions(button('CANCELAR','data-go="7"')+button('DEVOLVER','id="return-facts"',true))+'<div id="return-result" aria-live="polite"></div></section><div class="banner quiet">A devolução cria uma pendência; não apaga factos nem abre a janela de escrita do encarregado. Fora de hoje/ontem, a correção continua pelo Administrativo autorizado.</div>';}
if(view===10){html=heading('RH / CONFERÊNCIA MENSAL','Competência validada para integração','Pessoa exemplo 2 · Outubro 2026')+badge('VALIDADO PARA INTEGRAÇÃO','good')+metrics([['176h','Esperado'],['177h','Realizado'],['0','Pendências']])+'<section class="person"><h2>Conferência mensal concluída</h2><p>Factos conferidos · decisões concluídas · revisão aprovada 4.</p><p class="meta">Autor: Administrativo exemplo · 02/11/2026 10:15 · Dados sintéticos.</p><p>HE reconhecida: 1h · Informativo (HR-27). Esta validação não cria pagamentos ou custos de HE.</p>'+actions(button('VER HISTÓRICO','data-sim="Validação v4, fingerprint mensal e autor/data preservados na proposta."')+button('VER NOS MAPAS','data-go="12"'))+'</section>';}
if(view===11){html=heading('RH / CONFERÊNCIA MENSAL','Correção posterior à validação','Pessoa exemplo 2 · Outubro 2026')+badge('REQUER REVALIDAÇÃO','warning')+'<div class="banner">Factos revistos: a aprovação anterior deixou de autorizar a integração da revisão atual.</div>'+table(['Registo','Antes','Depois'],[['13/10 · saída','17:00','16:30'],['Horas do dia','8h','7h30'],['Realizado mensal','177h','176h30'],['Estado mensal','Validado · revisão 4','Requer revalidação · revisão 5']])+'<details open><summary>Histórico de alterações preservado</summary><p>Administrativo exemplo · motivo: correção documental de saída. Validação anterior permanece consultável.</p><p>Referência de jornada congelada permanece 8h. Decisão HE corrente, se afetada, exige nova análise.</p></details>'+actions(button('RECONFERIR MÊS','data-go="7"',true))+'<p class="meta">Se competência já estiver fechada, correção é bloqueada até reabertura explícita. Não sobrescrever integrações concluídas silenciosamente.</p>';}
if(view===12){html=heading('MAPAS / HORAS','Horas provisórias e validadas','Horas provisórias durante o mês e consolidadas após validação · Sem dupla contagem')+'<div class="modes"><button data-map="a" aria-pressed="true">HORAS PROVISÓRIAS</button><button data-map="b" aria-pressed="false">HORAS CONSOLIDADAS</button></div><div id="map-body"></div><div class="banner quiet">Estimativa provisória separada dos custos existentes. Tarifa interna exige aprovação RH e vigência; sem preço externo válido, mostrar apenas horas. Nenhum custo de HE é calculado.</div>';}
selectedName=view>=13?'Técnico exemplo':'Colaborador exemplo';root.innerHTML=html+'<div id="demo-feedback" class="feedback" role="status"></div><p class="foot">Modelo navegável para aprovação · Não grava dados · Nenhuma aprovação diária obrigatória · Sem implementação da integração.</p>';
if(root.querySelector('.contextual'))root.querySelector('.contextual').id='contextual';if(view>=1&&view<=3||view>=13){closed=false;if(view>=13){profile='tecnica';date='2026-10-16';mode=view===13?'manha':'tarde';setRows()}else{profile='operacional';date='2026-10-13';}if(view===1){mode='dia';setRows()}if(view===2){mode='personalizado';rows=[{dest:'a',start:'08:00',end:'10:00'},{dest:'b',start:'10:30',end:'12:00'},{dest:'c',start:'13:00',end:'14:30'},{dest:'a',start:'15:00',end:'17:00'}]}if(view===3){mode='personalizado';rows=[{dest:'garantia',ref:'Cliente exemplo · Reparação',start:'10:30',end:'14:30'},{dest:'outra',otherKind:'work',work:'b',ref:'Serviço exemplo',start:'15:00',end:'17:00'}]}root.querySelector('#contextual').innerHTML=form();updateTotal();}if(view===4)faltou();if(view===12)map('a');history.replaceState(null,'','#'+view);}
function show(v){view=Math.max(0,Math.min(14,v));render();window.scrollTo(0,0);}
function updateTotal(){const el=root.querySelector('#point-total');if(el)el.textContent='TOTAL REGISTADO: '+fmt(rows.reduce((n,r)=>n+(r.start&&r.end&&r.end>r.start?time(r.end)-time(r.start):0),0));}
function repaintPeriods(){root.querySelector('#periods').innerHTML=rows.map(period).join('');updateTotal();}
function faltou(){root.querySelector('#contextual').innerHTML='<section class="panel"><h2>Faltou · '+esc(selectedName)+'</h2><p>13/10/2026 · Obra exemplo A</p><p>Confirmar que a pessoa faltou neste dia? O Administrativo fará a classificação posterior.</p>'+badge('AGUARDA CLASSIFICAÇÃO ADMINISTRATIVA','warning')+actions(button('CANCELAR','id="cancel-form"')+button('CONFIRMAR FALTOU','id="confirm-faltou"',true))+'<p id="absence-error" role="alert" class="err"></p><p class="meta">A pessoa continua na equipa. Nenhuma hora ou saída será criada. Fica excluída de Dia Normal naquele dia.</p></section>';}
function map(option){root.querySelectorAll('[data-map]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.map===option));root.querySelector('#map-body').innerHTML=option==='a'?table(['Colaborador','Horas provisórias','Horas consolidadas','Estado'],[['Colaborador exemplo','175h','—',badge('EM CONFERÊNCIA','warning')],['Pessoa exemplo 2','—','176h',badge('VALIDADO','good')]])+'<p>Horas provisórias e consolidadas são estados da mesma origem/revisão, nunca uma soma. Custos existentes permanecem separados.</p>':table(['Colaborador','Horas integráveis','Estado'],[['Colaborador exemplo','—',badge('MÊS AINDA NÃO VALIDADO','warning')],['Pessoa exemplo 2','176h',badge('VALIDADO','good')]])+'<p>Fora da validação mensal, horas continuam visíveis no relatório operacional, sem alimentar a camada validada dos mapas.</p>';}
document.getElementById('scenario').addEventListener('change',e=>show(Number(e.target.value)));document.getElementById('next').onclick=()=>show(view+1);document.getElementById('previous').onclick=()=>show(view-1);
root.addEventListener('change',e=>{if(e.target.id==='profile'||e.target.id==='point-date'){if(e.target.id==='profile')profile=e.target.value;else date=e.target.value;setRows();root.querySelector('#contextual').innerHTML=form();updateTotal()}if(e.target.dataset.dest!==undefined){rows[Number(e.target.dataset.dest)].dest=e.target.value;repaintPeriods()}if(e.target.dataset.otherKind!==undefined){rows[Number(e.target.dataset.otherKind)].otherKind=e.target.value;repaintPeriods()}if(e.target.dataset.otherWork!==undefined){rows[Number(e.target.dataset.otherWork)].work=e.target.value;repaintPeriods()}if(e.target.id==='facts-checked')factsChecked=e.target.checked;if(e.target.id==='point-conflict'){root.querySelector('#confirm-faltou').disabled=e.target.checked;root.querySelector('#absence-error').textContent=e.target.checked?'Já existe ponto ou horas neste dia. Nada será apagado; regularização administrativa necessária.':''}});
root.addEventListener('input',e=>{if(e.target.dataset.time!==undefined){rows[Number(e.target.dataset.time)][e.target.dataset.field]=e.target.value;updateTotal()}if(e.target.dataset.ref!==undefined)rows[Number(e.target.dataset.ref)].ref=e.target.value});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go!==undefined)return show(Number(b.dataset.go));if(b.dataset.sim){root.querySelector('#demo-feedback').textContent='SIMULAÇÃO: '+b.dataset.sim;return}if(b.hasAttribute('data-open-editor')||b.hasAttribute('data-faltou')){const host=b.closest('.person').querySelector('.contextual');selectedName=b.closest('.person').querySelector('strong').textContent;root.querySelectorAll('.contextual').forEach(x=>{x.innerHTML='';x.removeAttribute('id')});host.id='contextual';}if(b.hasAttribute('data-open-editor')){mode='dia';setRows();b.closest('.person').querySelector('#contextual').innerHTML=form();updateTotal()}if(b.hasAttribute('data-faltou')){faltou();if(b.closest('.person').dataset.recorded==='true'){root.querySelector('#confirm-faltou').disabled=true;root.querySelector('#absence-error').textContent='Já existe ponto ou horas neste dia. Regularização administrativa necessária; nada será apagado.'}}if(b.dataset.mode){mode=b.dataset.mode;setRows();root.querySelector('#contextual').innerHTML=form();updateTotal()}if(b.id==='add-period'){if(rows.length<16){rows.push({dest:'a',start:'',end:''});repaintPeriods()}else root.querySelector('#point-error').textContent='Limite de 16 intervalos atingido.'}if(b.dataset.remove!==undefined){rows.splice(Number(b.dataset.remove),1);repaintPeriods()}if(b.id==='cancel-form'){b.closest('.panel').remove();root.querySelector('#demo-feedback').textContent='Cancelado. Nenhuma alteração efetuada.'}if(b.id==='preview-point'){let error='',xs=rows.filter(r=>r.start||r.end);if(!xs.length)error='Registe pelo menos uma entrada.';if(xs.some(r=>!r.start||!r.end||r.end<=r.start))error='Confirme entrada e saída válidas em todos os períodos.';xs.sort((a,b)=>a.start.localeCompare(b.start));if(xs.some((r,i)=>i&&r.start<xs[i-1].end))error='Os intervalos sobrepõem-se. Nada será gravado.';if(new Set(xs.map(r=>r.dest+(['garantia','outra'].includes(r.dest)?':'+r.ref:''))).size>4)error='Limite de 4 destinos atingido.';if(xs.some(r=>(r.dest==='garantia'||r.dest==='outra'&&r.otherKind==='free')&&!r.ref?.trim()))error='Indique o nome / referência original.';root.querySelector('#point-error').textContent=error;if(!error)root.querySelector('#point-preview').innerHTML='<div class="banner quiet">PREVIEW SIMULADO · '+xs.map(r=>esc(r.ref||r.dest)+' · '+r.start+'–'+r.end).join('<br>')+'<br>Factos exatos; jornada e equipa preservadas.</div>'+button('CONFIRMAR HORÁRIO','data-sim="Horário confirmado apenas neste protótipo. Nenhuma RPC executada."',true)}if(b.id==='confirm-faltou'){root.querySelector('#contextual').innerHTML='<div class="panel">'+badge('FALTOU · CLASSIFICAÇÃO PENDENTE','warning')+'<p>Reporte simulado. Pessoa continua na equipa, sem horas e excluída de Dia Normal.</p></div>'}if(b.id==='monthly-validate'){root.querySelector('#monthly-error').textContent=factsChecked?'Ainda existem horas em falta, ausência por classificar e excedente pendente. Não é possível validar esta competência.':'Confirme a conferência mensal dos factos.'}if(b.id==='decide-he'){decision=root.querySelector('#he-decision').value;const reason=root.querySelector('#he-reason').value.trim();root.querySelector('#he-error').textContent=!reason?'Indique o motivo da decisão.':'';if(reason)root.querySelector('#he-result').innerHTML='<div class="banner '+(decision==='nao_considerada'?'quiet':'')+'">'+(decision==='validada'?'HE RECONHECIDA — REGISTO INFORMATIVO. Quantidade e decisão preservadas. Não bloqueia por si só, não gera custo nem pagamento.':decision==='nao_considerada'?'HE NÃO CONSIDERADA. As 9h reais permanecem; apenas esta pendência HE fica resolvida.':'EXCEDENTE PENDENTE. Continua a bloquear.')+'<br>Autor/data e decisão preservados na proposta.</div>'}if(b.id==='return-facts'){const reason=root.querySelector('#return-reason').value.trim();root.querySelector('#return-result').textContent=reason?'SIMULAÇÃO: pedido de correção registado; factos atuais mantidos.':'Indique o motivo da devolução.'}if(b.dataset.map)map(b.dataset.map)});
setRows();render();
</script></body></html>
