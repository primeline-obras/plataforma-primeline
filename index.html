    <!-- C1_RECEPCAO_SAME_TAB_ENTRY -->
    <script type="module">
      import * as auth from "/src/supabase-browser.js?v=hours-session-20261105";
      (function installEntry({host,auth}){
 const root=host.document.querySelector('#root');if(!root)return;
 function sync(){
  const nav=root.querySelector('.sidebar nav');if(!nav)return;
  const old=nav.querySelector('[data-c1-recepcao-entry]');
  if(!auth.getSession()?.access_token){old?.remove();return;}
  if(old)return;
  const button=host.document.createElement('button');button.type='button';button.dataset.c1RecepcaoEntry='';
  button.setAttribute('aria-label','Recepção C1');button.title='Recepção C1 — abrir nesta aba';
  button.innerHTML='▤ <span>Recepção C1</span>';
  button.addEventListener('click',()=>host.location.assign('/c1-recepcao/'));
  nav.append(button);
 }
 const observer=new host.MutationObserver(sync);observer.observe(root,{childList:true,subtree:true});sync();
 return ()=>observer.disconnect();
})({host:window,auth});
    </script>
